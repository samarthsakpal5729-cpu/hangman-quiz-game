/* =====================================================
   GAME VARIABLES
===================================================== */

let gameQuestions = [];

let currentQuestion = 0;

let score = 0;

let lives = 5;

let guessedLetters = [];

let hiddenAnswer = "";

let gameFinished = false;

let transitioning = false;


/* =====================================================
   AUDIO
===================================================== */

let audioContext = null;

function getAudio(){

    if(!audioContext){

        const AudioClass =
            window.AudioContext ||
            window.webkitAudioContext;

        if(!AudioClass){
            return null;
        }

        audioContext = new AudioClass();
    }

    return audioContext;
}


function playTone(
    frequency,
    duration,
    type = "sine",
    volume = 0.12
){

    try{

        const audio = getAudio();

        if(!audio) return;

        if(audio.state === "suspended"){
            audio.resume();
        }

        const oscillator =
            audio.createOscillator();

        const gain =
            audio.createGain();

        oscillator.type = type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audio.currentTime
        );

        gain.gain.setValueAtTime(
            0.001,
            audio.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
            volume,
            audio.currentTime + 0.02
        );

        gain.gain.exponentialRampToValueAtTime(
            0.001,
            audio.currentTime + duration
        );

        oscillator.connect(gain);

        gain.connect(audio.destination);

        oscillator.start();

        oscillator.stop(
            audio.currentTime + duration
        );

    }catch(error){

        console.log("Audio unavailable");

    }
}


function playSound(type){

    try{

        if(type === "click"){

            playTone(
                500,
                0.08,
                "sine",
                0.08
            );

        }


        if(type === "correct"){

            playTone(
                700,
                0.12,
                "sine",
                0.12
            );

            setTimeout(() => {

                playTone(
                    950,
                    0.16,
                    "sine",
                    0.10
                );

            },100);

        }


        if(type === "wrong"){

            playTone(
                180,
                0.22,
                "sawtooth",
                0.08
            );

        }


        if(type === "win"){

            playTone(
                600,
                0.15,
                "sine",
                0.12
            );

            setTimeout(() => {

                playTone(
                    800,
                    0.15,
                    "sine",
                    0.12
                );

            },120);

            setTimeout(() => {

                playTone(
                    1100,
                    0.30,
                    "sine",
                    0.14
                );

            },240);

        }

    }catch(error){

        console.log("Sound error");

    }

}


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleQuestions(){

    gameQuestions = [...questions];

    for(
        let i = gameQuestions.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            gameQuestions[i],
            gameQuestions[j]
        ] =
        [
            gameQuestions[j],
            gameQuestions[i]
        ];

    }

}


/* =====================================================
   SCREEN SYSTEM
===================================================== */

function showScreen(screenId){

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    const target =
        document.getElementById(screenId);


    if(target){

        target.classList.add("active");

    }

}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    playSound("click");

    currentQuestion = 0;

    score = 0;

    lives = 5;

    guessedLetters = [];

    hiddenAnswer = "";

    gameFinished = false;

    transitioning = false;

    shuffleQuestions();

    showScreen("gameScreen");

    avatarMessage(
        "BOOM! Let's start! 🔥"
    );

    loadQuestion();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    if(
        currentQuestion >=
        gameQuestions.length
    ){

        finishGame();

        return;
    }


    lives = 5;

    guessedLetters = [];

    transitioning = false;


    const q =
        gameQuestions[currentQuestion];


    document
        .getElementById("questionNumber")
        .textContent =
        `${currentQuestion + 1}/${gameQuestions.length}`;


    document
        .getElementById("category")
        .textContent =
        q.category;


    document
        .getElementById("question")
        .textContent =
        q.question;


    /*
       Hide letters.

       C++ becomes:
       _ _ _ _

       Alphabetic answers become:
       _ _ _ _ _ _

       C++ is special because + must also
       be guessed.
    */

    hiddenAnswer =
        q.answer
            .split("")
            .map(character => {

                if(character === " "){
                    return " ";
                }

                return "_";

            })
            .join("");


    updateAnswer();

    updateGuessedLetters();

    updateStats();

    updateProgress();

    document
        .getElementById("message")
        .textContent = "";


    const input =
        document.getElementById(
            "letterInput"
        );


    input.value = "";


    drawHangman();

    avatarMessage(
        "Question time! 🧠"
    );


    setTimeout(() => {

        if(
            !gameFinished &&
            document
                .getElementById("gameScreen")
                .classList.contains("active")
        ){

            input.focus();

        }

    },150);

}


/* =====================================================
   ANSWER DISPLAY
===================================================== */

function updateAnswer(){

    const display =
        hiddenAnswer
            .split("")
            .map(character => {

                if(character === " "){
                    return " ";
                }

                return character;

            })
            .join(" ");

    document
        .getElementById("answer")
        .textContent =
        display;

}


/* =====================================================
   GUESSED LETTERS
===================================================== */

function updateGuessedLetters(){

    document
        .getElementById("guessed")
        .textContent =

        guessedLetters.length > 0

            ? "Guessed: " +
              guessedLetters.join(", ")

            : "Guessed: None";

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

    const livesElement =
        document.getElementById("lives");


    livesElement.textContent =
        "❤️ ".repeat(lives) +
        " " +
        lives;


    document
        .getElementById("score")
        .textContent =
        score;

}


/* =====================================================
   PROGRESS
===================================================== */

function updateProgress(){

    /*
       First question = 5%
       Last question = 100%
    */

    const percentage =
        (
            (currentQuestion + 1) /
            gameQuestions.length
        ) * 100;


    document
        .getElementById("progress")
        .style.width =
        percentage + "%";

}


/* =====================================================
   GUESS LETTER
===================================================== */

function guessLetter(){

    if(
        gameFinished ||
        transitioning
    ){

        return;

    }


    const input =
        document.getElementById(
            "letterInput"
        );


    let letter =
        input.value
            .toUpperCase()
            .trim();


    if(letter.length !== 1){

        showMessage(
            "⚠️ Enter ONE character."
        );

        avatarMessage(
            "One character at a time! 🤖"
        );

        playSound("wrong");

        input.value = "";

        return;

    }


    /*
       Allowed:
       A-Z
       +
    */

    if(!/^[A-Z+]$/.test(letter)){

        showMessage(
            "⚠️ Use A-Z or + only."
        );

        avatarMessage(
            "That character is not allowed! 😅"
        );

        playSound("wrong");

        input.value = "";

        return;

    }


    /*
       Prevent duplicate letters.

       For C++, + can be guessed twice
       because the answer contains two +.
    */

    if(
        letter !== "+" &&
        guessedLetters.includes(letter)
    ){

        showMessage(
            `⚠️ ${letter} already guessed!`
        );

        avatarMessage(
            "Try another character! 😎"
        );

        playSound("wrong");

        input.value = "";

        return;

    }


    if(
        letter === "+" &&
        guessedLetters.filter(
            item => item === "+"
        ).length >= 2
    ){

        showMessage(
            "⚠️ You already guessed all + symbols!"
        );

        input.value = "";

        return;

    }


    guessedLetters.push(letter);


    const answer =
        gameQuestions[currentQuestion]
            .answer
            .toUpperCase();


    let found = false;


    let newAnswer =
        hiddenAnswer.split("");


    /*
       Reveal matching characters.
    */

    for(
        let i = 0;
        i < answer.length;
        i++
    ){

        if(answer[i] === letter){

            newAnswer[i] = letter;

            found = true;

        }

    }


    hiddenAnswer =
        newAnswer.join("");


    /* =================================================
       CORRECT
    ================================================= */

    if(found){

        score += 5;


        showMessage(
            "✅ CORRECT! +5 POINTS"
        );


        avatarMessage(
            "BOOM! That's correct! 🔥"
        );


        playSound("correct");


        flashGame("correct");

    }


    /* =================================================
       WRONG
    ================================================= */

    else{

        lives--;


        showMessage(
            "❌ WRONG GUESS!"
        );


        avatarMessage(
            "Don't give up! 💪"
        );


        playSound("wrong");


        flashGame("wrong");

    }


    updateAnswer();

    updateGuessedLetters();

    updateStats();

    drawHangman();


    input.value = "";


    /* =================================================
       ANSWER COMPLETE
    ================================================= */

    if(hiddenAnswer === answer){

        transitioning = true;


        showMessage(
            "🎉 ANSWER COMPLETE!"
        );


        avatarMessage(
            "AMAZING! Next question! 🚀"
        );


        playSound("win");


        setTimeout(() => {

            nextQuestion();

        },1000);


        return;

    }


    /* =================================================
       CURRENT QUESTION GAME OVER
    ================================================= */

    if(lives <= 0){

        transitioning = true;


        setTimeout(() => {

            gameOver();

        },800);

    }

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion(){

    if(gameFinished){
        return;
    }


    currentQuestion++;


    if(
        currentQuestion >=
        gameQuestions.length
    ){

        finishGame();

    }

    else{

        loadQuestion();

    }

}


/* =====================================================
   GAME OVER CURRENT QUESTION
===================================================== */

function gameOver(){

    if(gameFinished){
        return;
    }


    const answer =
        gameQuestions[currentQuestion]
            .answer;


    showMessage(
        "💀 OUT OF LIVES! Answer: " +
        answer
    );


    avatarMessage(
        "No problem! Keep going! 🚀"
    );


    drawHangman();


    setTimeout(() => {

        nextQuestion();

    },1500);

}


/* =====================================================
   FINISH GAME
===================================================== */

function finishGame(){

    if(gameFinished){
        return;
    }


    gameFinished = true;

    transitioning = false;


    document
        .getElementById("finalScore")
        .textContent =
        score + " Points";


    let maxScore = 0;

    gameQuestions.forEach(q => {

        maxScore +=
            q.answer.replace(/ /g,"").length * 5;

    });


    let performance = "";


    if(score >= maxScore * 0.8){

        performance =
            "🔥 LEGENDARY! Outstanding OOP knowledge!";

    }

    else if(score >= maxScore * 0.6){

        performance =
            "🚀 GREAT JOB! Strong performance!";

    }

    else if(score >= maxScore * 0.4){

        performance =
            "💪 GOOD EFFORT! Keep practicing!";

    }

    else{

        performance =
            "📚 KEEP LEARNING! Practice makes perfect!";

    }


    document
        .getElementById("resultMessage")
        .textContent =
        performance +
        " You completed all " +
        gameQuestions.length +
        " questions.";


    showScreen("resultScreen");


    playSound("win");


    flashGame("win");

}


/* =====================================================
   AI MESSAGE
===================================================== */

function avatarMessage(message){

    const box =
        document.getElementById(
            "avatarMessage"
        );


    if(!box){
        return;
    }


    box.textContent =
        message;


    box.style.animation =
        "none";


    void box.offsetWidth;


    box.style.animation =
        "messagePop .4s ease";

}


/* =====================================================
   VISUAL FLASH EFFECT
===================================================== */

function flashGame(type){

    const container =
        document.querySelector(
            ".container"
        );


    if(!container){
        return;
    }


    if(type === "correct"){

        container.style.boxShadow =
            "0 0 30px #22d3ee," +
            "0 0 80px #22d3ee55";

    }


    if(type === "wrong"){

        container.style.boxShadow =
            "0 0 30px #ec4899," +
            "0 0 80px #ec489955";

    }


    if(type === "win"){

        container.style.boxShadow =
            "0 0 40px #facc15," +
            "0 0 100px #a855f766";

    }


    setTimeout(() => {

        container.style.boxShadow =
            "0 0 25px #7c3aed66," +
            "0 0 70px #06b6d433," +
            "inset 0 0 50px #ffffff05";

    },500);

}


/* =====================================================
   INSTRUCTIONS
===================================================== */

function showInstructions(){

    playSound("click");

    showScreen(
        "instructionScreen"
    );

}


/* =====================================================
   EXIT
===================================================== */

function exitGame(){

    playSound("click");


    alert(
        "💥 Thanks for playing BOOM BLASTIC Hangman! 💥"
    );

}


/* =====================================================
   HANGMAN DRAWING
===================================================== */

function drawHangman(){

    const canvas =
        document.getElementById(
            "hangmanCanvas"
        );


    if(!canvas){
        return;
    }


    const ctx =
        canvas.getContext("2d");


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Background glow
    */

    ctx.fillStyle =
        "#020617";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
       Glow settings
    */

    ctx.shadowBlur = 12;

    ctx.shadowColor =
        "#22d3ee";


    ctx.lineWidth = 5;

    ctx.strokeStyle =
        "#e2e8f0";

    ctx.lineCap =
        "round";


    /* =================================================
       GALLOWS
    ================================================= */

    ctx.beginPath();


    /* Base */

    ctx.moveTo(30,220);

    ctx.lineTo(210,220);


    /* Pole */

    ctx.moveTo(70,220);

    ctx.lineTo(70,30);


    /* Top */

    ctx.lineTo(170,30);


    /* Rope */

    ctx.lineTo(170,60);


    ctx.stroke();


    const wrong =
        5 - lives;


    /* =================================================
       HEAD
    ================================================= */

    if(wrong >= 1){

        ctx.beginPath();

        ctx.arc(
            170,
            85,
            25,
            0,
            Math.PI * 2
        );

        ctx.stroke();

    }


    /* =================================================
       BODY
    ================================================= */

    if(wrong >= 2){

        ctx.beginPath();

        ctx.moveTo(
            170,
            110
        );

        ctx.lineTo(
            170,
            165
        );

        ctx.stroke();

    }


    /* =================================================
       LEFT ARM
    ================================================= */

    if(wrong >= 3){

        ctx.beginPath();

        ctx.moveTo(
            170,
            125
        );

        ctx.lineTo(
            135,
            150
        );

        ctx.stroke();

    }


    /* =================================================
       RIGHT ARM
    ================================================= */

    if(wrong >= 4){

        ctx.beginPath();

        ctx.moveTo(
            170,
            125
        );

        ctx.lineTo(
            205,
            150
        );

        ctx.stroke();

    }


    /* =================================================
       LEGS
    ================================================= */

    if(wrong >= 5){

        ctx.beginPath();

        ctx.moveTo(
            170,
            165
        );

        ctx.lineTo(
            140,
            200
        );


        ctx.moveTo(
            170,
            165
        );

        ctx.lineTo(
            200,
            200
        );

        ctx.stroke();

    }


    /*
       Reset glow
    */

    ctx.shadowBlur = 0;

}


/* =====================================================
   ENTER KEY
===================================================== */

document
    .getElementById("letterInput")
    .addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                guessLetter();

            }

        }
    );


/* =====================================================
   INPUT AUTO UPPERCASE
===================================================== */

document
    .getElementById("letterInput")
    .addEventListener(
        "input",
        function(){

            this.value =
                this.value
                    .toUpperCase()
                    .slice(0,1);

        }
    );


/* =====================================================
   INITIALIZE
===================================================== */

window.addEventListener(
    "load",
    function(){

        showScreen(
            "menuScreen"
        );

    }
);

</script>
